spring.application.name=transcription

# H2 file DB for dev (swap url/driver for PostgreSQL, e.g. via env vars)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/db/transcription;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

app.storage.root=${STORAGE_ROOT:./data/uploads}
app.processing.poll-ms=2000
# Mock transcription API (replace base-url with the real service later)
app.transcription.base-url=${TRANSCRIPTION_BASE_URL:http://localhost:8080/mock-api}
# Random per-document delay so queue processing is visible; slow-chance share take up to 3x the max
app.mock.delay-min-ms=1000
app.mock.delay-max-ms=8000
app.mock.slow-chance=0.15
app.mock.failure-rate=0.0
# Share of transcriptions randomly sampled into the QA queue when their request completes
app.qa.sample-rate=${QA_SAMPLE_RATE:0.25}
# Demo request generator (POST /api/demo/requests) - disable outside demos
app.demo.enabled=true
